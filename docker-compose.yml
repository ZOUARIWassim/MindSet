version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:8
    container_name: mindset-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mindset
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - mindset-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mindset-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/mindset
      JWT_SECRET: ${JWT_SECRET:-1e7885352bd58ac80c080549d3b76051560d19aed12907b84db811c6d24b6ea6e8c2ac637046dee0b81e8c32b7a4515ee0ffec5b1ee919bf1c05e52c371d0281}
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mindset-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mindset-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mindset-network
    stdin_open: true
    tty: true

networks:
  mindset-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
