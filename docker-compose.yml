services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindset
      POSTGRES_PASSWORD: mindset
      POSTGRES_DB: mindset
    ports:
      - "5432:5432"
    volumes:
      - mindset-postgres-data:/var/lib/postgresql/data

volumes:
  mindset-postgres-data:
